// ---------------------------------------------------------------------
//  sound: a tiny chiptune synth, live in the browser (starts on the first tap; mute is remembered)
// ---------------------------------------------------------------------
const audio = { ac: null, master: null, muted: store.get('rm-game-muted') === '1', next: 0, step: 0 };
function audioStart() {
  if (audio.ac) { if (audio.ac.state === 'suspended') audio.ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  audio.ac = new AC(); audio.master = audio.ac.createGain(); audio.master.gain.value = audio.muted ? 0 : 0.5; audio.master.connect(audio.ac.destination);
  audio.next = audio.ac.currentTime + 0.1;
}

  o.type = type; o.frequency.setValueAtTime(f, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.master); o.start(t); o.stop(t + dur + 0.02);
}

  if (!audio.ac) return; const ac = audio.ac, n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(audio.master); s.start(t);
}
const MIDI = (m) => 440 * 2 ** ((m - 69) / 12);
const sfx = {
  block() { const t = audio.ac?.currentTime ?? 0; noise(t, 0.12, 0.5, 900); tone(MIDI(74), t, 0.18, 0.12); tone(MIDI(78), t, 0.18, 0.1); tone(MIDI(81), t, 0.18, 0.1); tone(160, t, 0.25, 0.25, 'sine', 50); },
  pay() { const t = audio.ac?.currentTime ?? 0; tone(MIDI(83), t, 0.06, 0.08); tone(MIDI(88), t + 0.06, 0.2, 0.08); },
  wrong() { const t = audio.ac?.currentTime ?? 0; tone(220, t, 0.25, 0.12, 'square', 110); },
  lost() { const t = audio.ac?.currentTime ?? 0; tone(300, t, 0.15, 0.12, 'sawtooth', 150); tone(150, t + 0.15, 0.35, 0.12, 'sawtooth', 70); noise(t, 0.3, 0.25, 400); },
  start() { const t = audio.ac?.currentTime ?? 0; [74, 78, 81, 86].forEach((m, i) => tone(MIDI(m), t + i * 0.07, 0.15, 0.09)); },
  over() { const t = audio.ac?.currentTime ?? 0; [81, 78, 74, 69].forEach((m, i) => tone(MIDI(m), t + i * 0.16, 0.3, 0.1, 'triangle')); },
};
// the music: an 8th-note arpeggio and a triangle bass at 120 BPM, scheduled a little ahead; it brightens as the game speeds up
const ARP = [62, 66, 69, 66, 62, 69, 66, 69], BASS = [50, 50, 45, 45, 47, 47, 43, 45];
function music() {
  if (!audio.ac || state !== 'play') return;
  const ac = audio.ac;
  if (audio.next < ac.currentTime) audio.next = ac.currentTime + 0.05;
  while (audio.next < ac.currentTime + 0.2) {
    const k = audio.step, up = level() > 0.5 ? 12 : 0;
    tone(MIDI(ARP[k % 8] + up), audio.next, 0.1, 0.025);
    if (k % 2 === 0) tone(MIDI(BASS[Math.floor(k / 4) % 8]), audio.next, 0.22, 0.09, 'triangle');
    audio.next += 0.25; audio.step++;
  }
}
function setMuted(m) {
  audio.muted = m; store.set('rm-game-muted', m ? '1' : '0');
  if (audio.master) audio.master.gain.value = m ? 0 : 0.5;
  const b = document.getElementById('mute'); b.setAttribute('aria-pressed', String(m)); b.textContent = m ? '♪ ×' : '♪';
  b.setAttribute('aria-label', lang === 'en' ? (m ? 'Sound off' : 'Sound on') : (m ? 'Ljud av' : 'Ljud på'));

// ---------------------------------------------------------------------
//  the game
// ---------------------------------------------------------------------
let state = 'title', t0 = 0, walkers = [], fx = [], lives = 3, score = 0, streak = 0, stopped = 0, damage = 0, jar = 0.6;
let nextSpawn = 0, slamUntil = 0, overAt = 0, heroMood = 'smile', heroMoodUntil = 0, toast = null;
let best = Number(store.get('rm-game-best')) || 0, newBest = false, signCount = null;
const elapsed = () => now - t0;
const level = () => clamp(elapsed() / 70, 0, 2);   // 0 → 1 over 70 s, then on to 2 at 140 s, so every round ends
const mult = () => 1 + Math.min(3, Math.floor(streak / 5));

function newGame() {
  state = 'play'; t0 = now; walkers = []; fx = []; lives = 3; score = 0; streak = 0; stopped = 0; damage = 0; jar = 0.6;
  nextSpawn = now + 0.8; newBest = false; document.getElementById('end').classList.remove('show');
  audioStart(); audio.step = 0; sfx.start();
}
function spawn() {
  const L = level(), last = walkers.filter((w) => w.state === 'walk').reduce((m, w) => Math.max(m, w.x), -1e9);
  if (last > SPAWN_X - 38) { nextSpawn = now + 0.2; return; }   // room for the widest sign
  const L1 = Math.min(1, L), bad = Math.random() < 0.42 + 0.13 * L1, labels = T().shops;
  walkers.push({
    x: SPAWN_X, label: labels[Math.floor(Math.random() * labels.length)], bad,
    disguised: bad && elapsed() > 14 && Math.random() < 0.15 + 0.3 * L1, revealX: GATE_X + 34 + Math.floor(Math.random() * 14),
    speed: (15 + 22 * L) * (elapsed() > 30 && Math.random() < 0.2 ? 1.5 : 1), state: 'walk', seed: Math.random(), lit: false, hop: 0, tState: now,
  });
  nextSpawn = now + Math.max(0.5, 2.3 - 1.6 * L) * (0.75 + Math.random() * 0.5);
}
function loseLife() {
  lives--; streak = 0; heroMood = 'sad'; heroMoodUntil = now + 0.9; shake = now + 0.3;
  if (lives <= 0) { state = 'dying'; overAt = now + 1.1; }
}
let shake = 0;
function tapAt(px, py) {
  if (state === 'title') { newGame(); return; }
  if (state !== 'play') return;
  // the nearest walking company under the finger (generous hit box: phones are small)
  let hit = null, bestD = 1e9;
  for (const w of walkers) {
    if (w.state !== 'walk') continue;
    if (px < w.x - 13 || px > w.x + 13 || py < GY - 44 || py > GY + 8) continue;
    const d = Math.abs(px - w.x); if (d < bestD) { bestD = d; hit = w; }
  }
  if (!hit) return;
  if (hit.bad) {
    hit.state = 'blocked'; hit.tState = now; stopped++; streak++; score += 10 * mult();
    slamUntil = now + 0.35; heroMood = 'happy'; heroMoodUntil = now + 0.7;
    fx.push({ kind: 'stamp', x: hit.x, y: GY - 48, t: now }, { kind: 'plus', x: hit.x, y: GY - 60, t: now, n: 10 * mult() });
    sfx.block();
  } else {
    hit.state = 'oops'; hit.tState = now; fx.push({ kind: 'oops', x: hit.x, y: GY - 50, t: now }); sfx.wrong(); loseLife();
  }
}
function update(dt) {
  if (state === 'play') {
    if (now >= nextSpawn) spawn();
    music();
  }
  for (const w of walkers) {
    const age = now - w.tState;
    if ((w.state === 'walk' || w.state === 'oops') && state !== 'play') continue;   // the street freezes when the round ends
    if (w.state === 'walk' || w.state === 'oops') {
      if (w.state === 'oops' && age > 0.6) { w.state = 'walk'; w.tState = now; w.wasOops = true; }
      else if (w.state === 'walk' || age > 0.6) w.x -= w.speed * dt;
      if (w.x <= GATE_X + 11 && state === 'play') {
        w.state = 'paid'; w.tState = now; w.x = GATE_X + 11;
        fx.push({ kind: 'coin', x0: JAR_X + 13, y0: GY - 34, x1: w.x, y1: GY - 18, t: now });
        jar = clamp(jar - 0.04, 0.15, 1);
        if (w.bad) { w.state = 'grabbed'; damage++; fx.push({ kind: 'text', s: T().bought, x: w.x, y: GY - 52, c: Q.red, t: now }); sfx.lost(); loseLife(); }
        else { if (!w.wasOops) { streak++; score += 5 * mult(); fx.push({ kind: 'plus', x: w.x, y: GY - 58, t: now, n: 5 * mult() }); } sfx.pay(); }
      }
    } else if (w.state === 'paid') { if (age > 0.35) w.lit = true; w.hop = age > 0.35 && age < 0.75 ? 6 * Math.sin(Math.PI * (age - 0.35) / 0.4) : 0; if (age > 1.0) w.gone = true; }
    else if (w.state === 'grabbed') { w.hop = age < 0.4 ? 4 * Math.abs(Math.sin(age * 20)) : 0; if (age > 1.0) { w.state = 'flee'; w.tState = now; } }
    else if (w.state === 'blocked') { w.x += 70 * Math.exp(-age * 6) * dt; if (age > 0.45) { w.state = 'flee'; w.tState = now; } }
    else if (w.state === 'flee') { w.x += 70 * dt; if (w.x > W + 20) w.gone = true; }
  }

  fx = fx.filter((f) => now - f.t < 1.2);

}
function gameOver() {
  state = 'over';
  if (score > best) { best = score; newBest = score > 0; store.set('rm-game-best', String(best)); }
  walkers.forEach((w) => { if (w.state === 'walk' || w.state === 'oops') { w.state = 'flee'; w.tState = now; } });   // everyone clears the street
  sfx.over(); showEnd();
  document.getElementById('live').textContent = T().live(stopped, score);
}
function showEnd() {
  const e = document.getElementById('end'); e.classList.add('show');
  document.getElementById('signBtn').textContent = T().sign;
  document.getElementById('againBtn').textContent = T().again;
  document.getElementById('shareBtn').textContent = T().share;
}

// ---------------------------------------------------------------------
//  drawing each state
// ---------------------------------------------------------------------
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function draw() {
  const sx = now < shake ? (Math.floor(now * 30) % 2 ? 1 : -1) : 0;
  ctx.setTransform(1, 0, 0, 1, sx, 0);
  drawScene(damage);
  drawJar(jar);
  drawGate(now < slamUntil ? 1 : 0);
  // walkers: far ones first
  [...walkers].sort((a, b) => b.x - a.x).forEach(drawCompany);
  // the hero guards the gate
  const mood = now < heroMoodUntil ? heroMood : state === 'over' ? (stopped > 0 ? 'happy' : 'sad') : 'smile';
  coinHero(GATE_X - 13, GY - 13, 7, { mood, hop: mood === 'happy' && now < heroMoodUntil ? 4 * Math.sin(Math.PI * clamp((heroMoodUntil - now) / 0.7)) : 0, look: 1 });
  // effects
  for (const f of fx) {
    const a = now - f.t;
    if (f.kind === 'stamp') stamp(f.x, f.y, a);
    else if (f.kind === 'plus') pixText('+' + f.n, f.x, f.y - Math.floor(a * 20), Q.yellow, { align: 'center', shadow: Q.ink });
    else if (f.kind === 'oops' && a < 0.9) { pixBox(f.x - 5, f.y - 4, 11, 12, { bg: Q.white }); pixText('?', f.x - 2, f.y - 1, Q.ink); }
    else if (f.kind === 'text' && a < 0.9) pixText(f.s, f.x, f.y - Math.floor(a * 10), f.c, { align: 'center', shadow: Q.ink });
    else if (f.kind === 'coin' && a < 0.4) { const u = a / 0.4; coinAt(lerp(f.x0, f.x1, u), lerp(f.y0, f.y1, u) - 18 * 4 * u * (1 - u)); }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'play' || state === 'dying') drawHud();
  else if (state === 'title') drawTitle();
  else if (state === 'over') drawOver();
  if (toast && now < toast.until) { const tw = pixTextW(toast.s) + 8; pixBox(Math.round((W - tw) / 2), 100, tw, 13, { bg: Q.ink, edge: Q.white, shadow: Q.shadow }); pixText(toast.s, W / 2, 103, Q.white, { align: 'center' }); }
}
function drawHud() {
  prect(0, 0, W, 16, Q.ink); prect(0, 16, W, 1, Q.slate);
  pixText(fmt(score), 4, 5, Q.white);
  if (mult() > 1) pixText('x' + mult(), 4 + pixTextW(fmt(score)) + 5, 5, Q.lime);
  for (let i = 0; i < 3; i++) sprite(SPR.heart, { a: i < lives ? Q.red : Q.slate, b: i < lives ? Q.pink : Q.slate }, W - 26 + i * 8, 5);
  // the instruction, for the first few seconds
  if (elapsed() < 4.5 && Math.floor(now * 3) % 2 === 0) { const s = T().hint, tw = pixTextW(s) + 8; pixBox(Math.round((W - tw) / 2), 198, tw, 13, { bg: Q.ink, edge: Q.lime }); pixText(s, W / 2, 201, Q.lime, { align: 'center' }); }
}
function panel(y, h) { prect(6, y, W - 12, h, Q.shadow); pixBox(5, y - 1, W - 12, h, { bg: Q.ink, edge: Q.white }); }
function drawTitle() {
  panel(22, 104);
  stamp(W / 2, 40, 1);

  T().how.forEach((s, i) => pixText(s, W / 2, 72 + i * 11, i === 1 ? Q.red : Q.white, { align: 'center' }));
  if (Math.floor(now * 2.5) % 2 === 0) { const s = T().tap, tw = pixTextW(s) + 8; pixBox(Math.round((W - tw) / 2), 196, tw, 13, { bg: Q.lime, edge: Q.ink, shadow: Q.shadow }); pixText(s, W / 2, 199, Q.ink, { align: 'center' }); }

function drawOver() {
  panel(20, 112);

  const lines = T().stopped(stopped);
  pixText(lines[0], W / 2, 50, Q.white, { align: 'center' });
  pixText(lines[1], W / 2, 61, Q.lime, { align: 'center' });
  pixText(lines[2], W / 2, 72, Q.lime, { align: 'center' });
  pixText(`${T().score} ${fmt(score)}`, W / 2, 88, Q.yellow, { align: 'center' });
  pixText(newBest ? T().newBest : `${T().best} ${fmt(best)}`, W / 2, 99, newBest && Math.floor(now * 3) % 2 ? Q.lime : Q.grey, { align: 'center' });
  if (signCount != null) pixText(T().signed(fmt(signCount)), W / 2, 116, Q.white, { align: 'center' });
}

// ---------------------------------------------------------------------
//  the loop, input, language, sharing, the live signature count
// ---------------------------------------------------------------------
let lastFrame = performance.now();
function frame(ms) {
  const dt = Math.min(0.05, (ms - lastFrame) / 1000); lastFrame = ms;
  if (!document.hidden) { now += dt; update(dt); draw(); }
  requestAnimationFrame(frame);
}
function toPixel(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); audioStart(); const [x, y] = toPixel(e); tapAt(x, y); });
window.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && (state === 'title' || (state === 'over' && now > overAt + 0.6)) && document.activeElement?.tagName !== 'BUTTON' && document.activeElement?.tagName !== 'A') { e.preventDefault(); audioStart(); newGame(); }
});
document.getElementById('againBtn').addEventListener('click', () => { audioStart(); newGame(); });
document.getElementById('shareBtn').addEventListener('click', async () => {
  const url = new URL('./', location.href).href, text = T().shareText(stopped);
  try {
    if (navigator.share) { await navigator.share({ title: 'KÖPER EJ', text, url }); return; }
    await navigator.clipboard.writeText(`${text} ${url}`);
    toast = { s: T().copied, until: now + 1.8 };
  } catch { /* the user closed the share sheet */ }
});
document.getElementById('mute').addEventListener('click', () => setMuted(!audio.muted));
function setLang(l) {
  lang = l; store.set('rm-lang', l);   // the same setting the main site uses
  document.documentElement.lang = l; document.title = T().title; cv.setAttribute('aria-label', T().aria);
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  // a company already on the street keeps its sign; new ones use the new language
  if (state === 'over') showEnd();
  setMuted(audio.muted);
}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
fetch(COUNT_URL, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((d) => { const n = Number.parseInt(d?.count, 10); if (Number.isFinite(n)) signCount = n; }).catch(() => {});
document.getElementById('signBtn').href = PETITION_URL;
setLang(lang);
requestAnimationFrame(frame);
</script>
</body>
