  drawCard(small.getContext('2d'));
  const big = document.createElement('canvas'); big.width = W * 8; big.height = H * 8;
  const g = big.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(small, 0, 0, big.width, big.height);

    // phones that can share an image get it through "Dela"; elsewhere a "Spara bild" button downloads it

}
function cardFile(b) { return new File([b], 'koper-ej.png', { type: 'image/png' }); }
function canShareFiles(b) { try { return !!(navigator.canShare && navigator.canShare({ files: [cardFile(b)] })); } catch { return false; } }

// ---------------------------------------------------------------------
//  drawing each state
// ---------------------------------------------------------------------
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function wrap(str, max) {

  const words = [];
  for (const w of str.split(' ')) {
    if (w.replace(/~/g, '').length <= max) words.push(w.replace(/~/g, ''));
    else { const parts = w.split('~'); parts.forEach((q, i) => words.push(i < parts.length - 1 ? q + '-' : q)); }
  }

  for (const word of words) { const t = line ? (line.endsWith('-') ? line + word : line + ' ' + word) : word; if (t.length > max && line) { out.push(line); line = word; } else line = t; }
  if (line) out.push(line); return out;
}
function drawBoss() {
  const b = boss; if (!b) return;
  const x = Math.round(b.x), fy = Math.round(b.y), bw = 40, bh = 30, top = fy - bh - 6, x0 = x - bw / 2;
  const exposed = b.state === 'exposed', blink = exposed && Math.floor(now * 8) % 2;
  pellipse(x, fy, 21, 3, Q.shadow);
  const fr = Math.floor(now * 4) % 2;
  for (const s of [-1, 1]) prect(x + s * 10 - 2, fy - 6 + (fr === (s > 0 ? 1 : 0) ? 1 : 0), 4, 6, Q.ink);
  prect(x0, top, bw, bh, Q.ink); prect(x0 + 1, top + 1, bw - 2, bh - 2, blink ? Q.orange : Q.red);
  prect(x0 + 1, top + 1, bw - 2, 2, Q.orange);
  for (let i = 0; i < b.hp; i++) prect(x0 + 3 + (i % 4) * 9, top + 13 + Math.floor(i / 4) * 6, 7, 4, i % 2 ? Q.grey : Q.white);   // the armour plates
  for (const s of [-1, 1]) { prect(x + s * 7 - 2, top + 4, 5, 4, Q.white); prect(x + s * 7 - 2 + (s < 0 ? 1 : 0), top + 6, 3, 2, Q.ink); prect(x + s * 7 - 3, top + 3, 6, 1, Q.ink); }
  prect(x - 5, top + 10, 11, 1, Q.ink); pset(x - 6, top + 9, Q.ink); pset(x + 6, top + 9, Q.ink);
  // a top hat with a crown of coins, and the sign
  prect(x - 9, top - 7, 18, 7, Q.ink); prect(x - 8, top - 6, 16, 5, Q.night); prect(x - 12, top - 1, 24, 2, Q.ink);
  for (let k = 0; k < 3; k++) coinAt(x - 6 + k * 6, top - 10, k);
  const sw = pixTextW(T().bossName) + 6; pixBox(x - Math.floor(sw / 2), top - 26, sw, 13, { bg: Q.ink }); pixText(T().bossName, x, top - 22, Q.red, { align: 'center' });
  if (b.stampT != null) seal(x, top + Math.floor(bh / 2), now - b.stampT, 2);   // stamped (twice the size), and carried off with it
  // its armour, as a bar
  if (b.state === 'fight' || b.state === 'exposed') { prect(x - 16, fy + 4, 32, 4, Q.ink); prect(x - 15, fy + 5, Math.round(30 * b.hp / b.maxHp), 2, Q.grey); if (exposed) for (let i = 0; i < BOSS_HITS; i++) prect(x - 9 + i * 5, fy + 5, 3, 2, i < BOSS_HITS - b.hits ? Q.lime : Q.slate); }
}
function draw() {

  drawWorld(pol, GATE_Y - 80 - Math.floor(now * 40) % 40);

  coinHero(HERO.x, HERO.y, 7, { mood, y0: HERO.y, hop: mood === 'happy' && now < heroMoodUntil ? 4 * Math.sin(Math.PI * clamp((heroMoodUntil - now) / 0.7)) : 0, look: -1 });

    }
    else if (f.kind === 'plus') pixText('+' + f.n, f.x, f.y - Math.floor(a * 20), Q.yellow, { align: 'center', shadow: Q.ink });
    else if (f.kind === 'plus1' && a < 0.8) pixText(T().plusSig, f.x, f.y - Math.floor(a * 20), Q.white, { align: 'center', shadow: Q.ink });

    else if (f.kind === 'oops' && a < 0.9) { pixBox(f.x - 5, f.y - 4, 11, 12, { bg: Q.white }); pixText('?', f.x - 2, f.y - 1, Q.ink); }
    else if (f.kind === 'text' && a < 0.9) pixText(f.s, f.x, f.y - Math.floor(a * 10), f.c, { align: 'center', shadow: Q.ink });
    else if (f.kind === 'coin' && a < 0.4) { const u = a / 0.4; coinAt(lerp(f.x0, f.x1, u), lerp(f.y0, f.y1, u) - 14 * 4 * u * (1 - u)); }
  }

    const y0 = banner.center ? Math.round((ROAD_Y0 + GATE_Y - bh) / 2) : GATE_Y - 10 - bh;
    pixBox(Math.round((W - tw) / 2), y0, tw, bh, { bg: Q.ink, edge: banner.color, shadow: Q.shadow });
    banner.lines.forEach((s, i) => pixText(s, W / 2, y0 + 4 + i * 10, i === 0 ? banner.color : Q.white, { align: 'center' }));
  }
  // signature papers fly above everything on the street, hints included
  if (state === 'play' || state === 'clear') papers.forEach((p) => {
    drawPaper(p);
    if (p.first) { const s = T().tapMe, tw = pixTextW(s) + 6, bx = Math.round(clamp(p.x - tw / 2, 2, W - tw - 2)), by = Math.round(p.y) - 24;
      pixBox(bx, by, tw, 11, { bg: Q.white, edge: Q.ink }); pixText(s, bx + 3, by + 2, Q.ink); prect(Math.round(p.x), by + 11, 1, 3, Q.ink); }
  });
  if (toast && now < toast.until) { const tw = pixTextW(toast.s) + 8; pixBox(Math.round((W - tw) / 2), 100, tw, 13, { bg: Q.ink, edge: Q.white, shadow: Q.shadow }); pixText(toast.s, W / 2, 103, Q.white, { align: 'center' }); }
}
function drawHud() {
  prect(0, 0, W, ROAD_Y0, Q.ink); prect(0, ROAD_Y0 - 1, W, 1, Q.slate);
  pixText(fmt(score), 4, 4, Q.white);
  if (mult() > 1) pixText('x' + mult(), 4 + pixTextW(fmt(score)) + 5, 4, Q.lime);
  for (let i = 0; i < 3; i++) sprite(SPR.heart, { a: i < lives ? Q.red : Q.slate, b: i < lives ? Q.pink : Q.slate }, W - 26 + i * 8, 4);
  // where you are: the sector and its goal, the boss, or endless
  const where = phase === 'level' ? `${T().levels[li].name} ${Math.min(levelStopped, LEVELS[li].goal)}/${LEVELS[li].goal}` : phase === 'boss' ? T().bossName : T().endless[0];
  pixText(where, 4, 15, phase === 'boss' ? Q.red : Q.grey);
  // the signature meter: a paper, five cells and a count; full = ETISK POLICY (the cells then count down)
  const pol = policyOn();
  prect(86, 15, 6, 7, Q.white); prect(87, 17, 4, 1, Q.grey); prect(87, 19, 4, 1, Q.grey);
  for (let i = 0; i < SIG_FULL; i++) {
    const on = pol ? (policyUntil - now) / POLICY_SECS * SIG_FULL > i : i < sig;
    prect(95 + i * 5, 15, 4, 7, on ? Q.lime : Q.slate);
  }
  pixText(pol ? 'P' : `${sig}`, 123, 15, pol ? Q.lime : Q.white);
  if (phase === 'level' && li === 0 && !returning && now - phaseT < 4.5 && state === 'play' && Math.floor(now * 3) % 2 === 0) { const s = T().hint, tw = pixTextW(s) + 8; pixBox(Math.round((W - tw) / 2), 150, tw, 13, { bg: Q.ink, edge: Q.lime }); pixText(s, W / 2, 153, Q.lime, { align: 'center' }); }
}
function panel(y, h) { prect(6, y, W - 12, h, Q.shadow); pixBox(5, y - 1, W - 12, h, { bg: Q.ink, edge: Q.white }); }
function drawFact() {
  const f = T().facts[factIdx], lines = wrap(f.text, 18), h = 40 + lines.length * 10;
  const y = Math.round(100 - h / 2);
  panel(y, h);
  pixText(f.head, W / 2, y + 6, Q.yellow, { align: 'center' });
  lines.forEach((s, i) => pixText(s, W / 2, y + 20 + i * 10, Q.white, { align: 'center' }));
  pixText(T().source, W / 2, y + h - 14, Q.grey, { align: 'center' });
  if (now - factShownAt > 0.8 && Math.floor(now * 2.5) % 2 === 0) { const s = T().next, tw = pixTextW(s) + 8; pixBox(Math.round((W - tw) / 2), y + h + 8, tw, 13, { bg: Q.lime, edge: Q.ink, shadow: Q.shadow }); pixText(s, W / 2, y + h + 11, Q.ink, { align: 'center' }); }
}
function drawTitle() {
  panel(22, 104);
  stamp(W / 2, 40, 1, true);
  pixText('RÄTTVISA MALMÖ', W / 2, 56, Q.grey, { align: 'center' });
  T().how.forEach((s, i) => pixText(s, W / 2, 72 + i * 11, i === 1 ? Q.red : Q.white, { align: 'center' }));
  if (Math.floor(now * 2.5) % 2 === 0) { const s = T().tap, tw = pixTextW(s) + 8; pixBox(Math.round((W - tw) / 2), 150, tw, 13, { bg: Q.lime, edge: Q.ink, shadow: Q.shadow }); pixText(s, W / 2, 153, Q.ink, { align: 'center' }); }
  if (best > 0) pixText(`${T().best} ${fmt(best)}`, W / 2, 172, Q.white, { align: 'center', shadow: Q.ink });
}
function drawOver() {
  panel(20, 124);
  pixText(T().over, W / 2, 27, Q.white, { align: 'center', scale: 2 });
  const lines = T().stopped(stopped);
  pixText(lines[0], W / 2, 50, Q.white, { align: 'center' });
  pixText(lines[1], W / 2, 61, Q.lime, { align: 'center' });
  pixText(lines[2], W / 2, 72, Q.lime, { align: 'center' });
  pixText(reachedText(), W / 2, 86, Q.white, { align: 'center' });
  pixText(`${T().score} ${fmt(score)}`, W / 2, 100, Q.yellow, { align: 'center' });
  pixText(newBest ? T().newBest : `${T().best} ${fmt(best)}`, W / 2, 111, newBest && Math.floor(now * 3) % 2 ? Q.lime : Q.grey, { align: 'center' });
  if (signCount != null) pixText(T().signed(fmt(signCount)), W / 2, 128, Q.white, { align: 'center' });

// ---------------------------------------------------------------------
//  the loop, input, language, sharing, the live signature count
// ---------------------------------------------------------------------
let lastFrame = performance.now();
function frame(ms) {
  const dt = Math.min(0.05, (ms - lastFrame) / 1000); lastFrame = ms;
  if (!document.hidden) { now += dt; update(dt); draw(); }
  requestAnimationFrame(frame);
}
function toPixel(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
let lastPointer = 'touch';
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); lastPointer = e.pointerType || 'touch'; audioStart(); const [x, y] = toPixel(e); if (state === 'play') fx.push({ kind: 'tap', x: Math.round(x), y: Math.round(y), t: now }); tapAt(x, y); });
window.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && state === 'fact') { e.preventDefault(); tapAt(0, 0); return; }
  if ((e.key === 'Enter' || e.key === ' ') && (state === 'title' || (state === 'over' && now > overAt + 0.6)) && document.activeElement?.tagName !== 'BUTTON' && document.activeElement?.tagName !== 'A') { e.preventDefault(); audioStart(); newGame(); }
});
document.getElementById('againBtn').addEventListener('click', () => { audioStart(); newGame(); });
// sharing: the phone's share menu where there is one, else copy the link, else show it. The share menu and the clipboard
// API only exist on secure pages (https, localhost), so a page opened over plain http needs the old copy command too.
const SHARE_URL = 'https://rattvisamalmo.se/spel/';   // always the public address, wherever the page was opened from
function copyOld(str) {
  const ta = document.createElement('textarea');
  ta.value = str; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, str.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove(); return ok;
}
document.getElementById('shareBtn').addEventListener('click', async () => {
  const text = T().shareText(stopped, bossBeaten), all = `${text} ${SHARE_URL}`;
  // with the story card where the phone can share images (the link goes in the text: some apps drop the url field
  // when an image is attached, and Instagram drops both, which is why the card carries the address itself)
  if (cardBlob && canShareFiles(cardBlob)) {
    try { await navigator.share({ files: [cardFile(cardBlob)], title: 'KÖPER EJ', text: all }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (navigator.share) {
    try { await navigator.share({ title: 'KÖPER EJ', text, url: SHARE_URL }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // closed the share menu: fine; any other failure falls through to copying
  }
  let ok = false;

  if (!ok) ok = copyOld(all);

});
document.getElementById('mute').addEventListener('click', () => setMuted(!audio.muted));
function setLang(l) {

  document.documentElement.lang = l; document.title = T().title; cv.setAttribute('aria-label', T().aria);
  document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));

}
document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
fetch(COUNT_URL, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((d) => { const n = Number.parseInt(d?.count, 10); if (Number.isFinite(n)) signCount = n; }).catch(() => {});
document.getElementById('signBtn').href = PETITION_URL;
setLang(lang);
requestAnimationFrame(frame);
